[project]
name = "toushou-monitor-tui"
version = "0.1.0"
description = "Terminal User Interface (TUI) for hardware-level multi-monitor control via DDC/CI on Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "monitorcontrol>=3.1.0",
    "textual>=0.70.0",
    "typer>=0.12.0",
]

[project.scripts]
toushou = "src.cli:main"
toushou-tui = "src.app:main"
toushou-desktop = "src.desktop:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["."]
