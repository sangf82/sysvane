<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toushou Monitor</title>
<style>
  :root {
    --canvas: #ffffff;
    --canvas-soft: #fafafa;
    --ink: #171717;
    --ink-secondary: #212121;
    --ink-mute: #707070;
    --ink-faint: #b2b2b2;
    --hairline: #dfdfdf;
    --hairline-soft: #ededed;
    --hairline-strong: #c7c7c7;
    --primary: #3ecf8e;
    --primary-deep: #24b47e;
    --on-primary: #171717;
    --night: #1c1c1c;
    --night-soft: #202020;
    --on-dark: #ffffff;
    --error: #e2005a;
    --sans: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-1: 0 1px 3px rgba(0, 0, 0, .06);
    --shadow-2: 0 8px 24px rgba(0, 0, 0, .08);
    --shadow-3: 0 16px 48px rgba(0, 0, 0, .12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, select, input { font: inherit; }
  button {
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: var(--canvas-soft); border-color: var(--ink-mute); }
  button:disabled { color: var(--ink-faint); border-color: var(--hairline); cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.primary:hover { background: var(--primary-deep); border-color: var(--primary-deep); }
  :focus-visible { outline: 2px solid var(--primary-deep); outline-offset: 2px; }

  #app { display: grid; grid-template-columns: 268px 1fr; grid-template-rows: 64px 1fr 40px; height: 100vh; }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--canvas);
  }
  header .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); font-size: 18px; font-weight: 500; letter-spacing: -0.42px;
  }
  header .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  header .sub { color: var(--ink-mute); font-size: 13px; }
  header .spacer { flex: 1; }

  aside {
    border-right: 1px solid var(--hairline);
    background: var(--canvas-soft);
    padding: 20px 16px;
    overflow-y: auto;
  }
  aside h2, main h2 {
    font-size: 13px; font-weight: 500; letter-spacing: 0;
    color: var(--ink-mute); margin: 0 0 12px;
  }
  .monitor {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 12px 14px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
  }
  .monitor:hover { background: var(--canvas); border-color: var(--hairline-strong); }
  .monitor.active { border-color: var(--primary); background: rgba(62, 207, 142, .06); }
  .monitor .name { color: var(--ink); font-weight: 500; }
  .monitor .meta { color: var(--ink-mute); font-size: 12px; margin-top: 3px; }

  main { padding: 24px 28px; overflow-y: auto; background: var(--canvas); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip {
    border: 1px solid var(--hairline-soft);
    border-radius: 9999px;
    padding: 4px 12px;
    background: var(--canvas-soft);
    color: var(--ink-mute);
    font-size: 12px;
  }
  .chip b { color: var(--ink); font-weight: 500; }

  .category { color: var(--ink-mute); margin: 24px 0 6px; font-size: 13px; font-weight: 500; }
  .control {
    display: grid; grid-template-columns: 210px 64px 120px 1fr; gap: 12px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--hairline-soft);
  }
  .control:hover { background: var(--canvas-soft); }
  .control .label { color: var(--ink); }
  .control .code { color: var(--ink-mute); font-family: var(--mono); font-size: 12px; }
  .control .value { color: var(--ink-secondary); font-family: var(--mono); font-size: 13px; }
  .control.readonly .value { color: var(--ink-mute); }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 9999px; margin-left: 8px;
  }
  .badge.exp { background: var(--primary); color: var(--on-primary); }
  .badge.danger { color: var(--error); border: 1px solid var(--error); }
  .control .editor { display: flex; align-items: center; gap: 8px; }
  .control input[type="range"] { flex: 1; accent-color: var(--primary); }
  .control select {
    flex: 1;
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
  }
  .control .step { padding: 4px 10px; font-weight: 500; }

  #profiles { margin-top: 32px; border-top: 1px solid var(--hairline); padding-top: 20px; }
  .profile {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    margin-bottom: 8px;
  }
  .profile .name { color: var(--ink); font-weight: 500; }
  .profile .desc { color: var(--ink-mute); flex: 1; font-size: 13px; }

  footer {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 8px;
    padding: 0 24px;
    border-top: 1px solid var(--hairline);
    background: var(--canvas);
    color: var(--ink-mute);
    font-size: 12px;
  }
  footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  footer .dot.busy { background: var(--ink-faint); }

  #toast {
    position: fixed; right: 24px; bottom: 56px; max-width: 420px;
    padding: 12px 16px;
    background: var(--night);
    color: var(--on-dark);
    border: 1px solid var(--night-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-2);
    opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--night); color: #ff9ec4; border-color: var(--error); }

  #modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(23, 23, 23, .35);
    backdrop-filter: blur(2px);
  }
  #modal.show { display: flex; }
  #modal .box {
    width: 460px; padding: 24px;
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-3);
  }
  #modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand"><span class="brand-dot"></span>toushou</span>
    <span class="sub">DDC/CI monitor control</span>
    <span class="spacer"></span>
    <button id="refresh">Refresh</button>
  </header>

  <aside>
    <h2>Monitors</h2>
    <div id="monitors"></div>
  </aside>

  <main>
    <div class="chips" id="chips"></div>
    <div id="controls"></div>

    <section id="profiles">
      <h2>Profiles</h2>
      <div id="profiles-list"></div>
    </section>
  </main>

  <footer><span class="dot" id="dot"></span><span id="status">Starting...</span></footer>
</div>

<div id="toast"></div>
<div id="modal">
  <div class="box">
    <div id="modal-text"></div>
    <div class="actions">
      <button id="modal-no">Cancel</button>
      <button id="modal-yes" class="primary">Continue</button>
    </div>
  </div>
</div>

<script>
const api = () => window.pywebview.api;
let state = { monitors: [], active: 0, controls: [], profiles: [] };
let busy = false;

function setBusy(on, text) {
  busy = on;
  document.getElementById('dot').classList.toggle('busy', on);
  if (text) document.getElementById('status').textContent = text;
}

function toast(message, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove('show'), 3200);
}

function askConfirm(message) {
  return new Promise((resolve) => {
    const modal = document.getElementById('modal');
    document.getElementById('modal-text').textContent = message;
    modal.classList.add('show');
    const yes = document.getElementById('modal-yes');
    const no = document.getElementById('modal-no');
    const done = (value) => {
      modal.classList.remove('show');
      yes.onclick = null;
      no.onclick = null;
      resolve(value);
    };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
  });
}

function renderMonitors() {
  const box = document.getElementById('monitors');
  box.innerHTML = '';
  if (!state.monitors.length) {
    box.innerHTML = '<div style="color:var(--muted)">No DDC/CI monitors detected.</div>';
    return;
  }
  state.monitors.forEach((monitor) => {
    const button = document.createElement('button');
    button.className = 'monitor' + (monitor.index === state.active ? ' active' : '');
    button.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    button.querySelector('.name').textContent = monitor.name;
    button.querySelector('.meta').textContent = `${monitor.model} · EDID ${monitor.edid}`;
    button.onclick = () => loadMonitor(monitor.index);
    box.appendChild(button);
  });
}

function chip(label, value) {
  return `<span class="chip">${label} <b>${value || '-'}</b></span>`;
}

function renderChips() {
  const byKey = Object.fromEntries(state.controls.map((c) => [c.key, c]));
  const show = (key) => byKey[key] ? byKey[key].formatted : '-';
  document.getElementById('chips').innerHTML =
    chip('Signal', show('vertical-frequency')) +
    chip('Brightness', show('brightness')) +
    chip('Input', show('input-source')) +
    chip('Preset', show('color-preset'));
}

function makeEditor(control) {
  const editor = document.createElement('div');
  editor.className = 'editor';

  if (control.read_only) {
    const info = document.createElement('span');
    info.style.color = 'var(--muted)';
    info.textContent = 'reported by monitor';
    editor.appendChild(info);
    return editor;
  }
  if (!control.writable) {
    const info = document.createElement('span');
    info.style.color = 'var(--muted)';
    info.textContent = 'unavailable';
    editor.appendChild(info);
    return editor;
  }

  if (control.values.length) {
    const select = document.createElement('select');
    control.values.forEach((option) => {
      const el = document.createElement('option');
      el.value = option.value;
      el.textContent = option.label;
      if (option.value === control.value) el.selected = true;
      select.appendChild(el);
    });
    select.onchange = () => writeControl(control, Number(select.value));
    editor.appendChild(select);
    return editor;
  }

  const dec = document.createElement('button');
  dec.className = 'step';
  dec.textContent = '−';
  dec.onclick = () => writeControl(control, control.value - 1);

  const range = document.createElement('input');
  range.type = 'range';
  range.min = control.min;
  range.max = control.max;
  range.step = 1;
  range.value = control.value;
  range.oninput = () => { control._preview = Number(range.value); updateValueLabel(control); };
  range.onchange = () => writeControl(control, Number(range.value));

  const inc = document.createElement('button');
  inc.className = 'step';
  inc.textContent = '+';
  inc.onclick = () => writeControl(control, control.value + 1);

  editor.append(dec, range, inc);
  return editor;
}

function updateValueLabel(control) {
  const el = document.getElementById(`value-${control.code_key}`);
  if (!el) return;
  el.textContent = control._preview ?? control.formatted;
}

function renderControls() {
  const box = document.getElementById('controls');
  box.innerHTML = '';
  if (!state.controls.length) {
    box.innerHTML = '<div style="color:var(--muted)">No controls reported. Try Refresh, and enable DDC/CI in the monitor OSD.</div>';
    return;
  }

  let category = '';
  state.controls.forEach((control) => {
    if (control.category !== category) {
      category = control.category;
      const heading = document.createElement('div');
      heading.className = 'category';
      heading.textContent = category;
      box.appendChild(heading);
    }

    const row = document.createElement('div');
    row.className = 'control' + (control.read_only ? ' readonly' : '');

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = control.label;
    if (control.experimental) {
      const badge = document.createElement('span');
      badge.className = 'badge exp';
      badge.textContent = 'EXP';
      label.appendChild(badge);
    }
    if (control.dangerous) {
      const badge = document.createElement('span');
      badge.className = 'badge danger';
      badge.textContent = '!';
      label.appendChild(badge);
    }

    const code = document.createElement('div');
    code.className = 'code';
    code.textContent = control.code_key;

    const value = document.createElement('div');
    value.className = 'value';
    value.id = `value-${control.code_key}`;
    value.textContent = control.formatted;

    row.append(label, code, value, makeEditor(control));
    box.appendChild(row);
  });
}

async function writeControl(control, value) {
  if (busy) return;
  const bounded = Math.max(control.min, Math.min(control.max, value));
  let confirm = false;
  if (control.dangerous) {
    confirm = await askConfirm(`${control.label}: switching this can black out the display. Continue?`);
    if (!confirm) { renderControls(); return; }
  } else if (control.experimental) {
    confirm = await askConfirm(`${control.label} is an experimental code. Write it anyway?`);
    if (!confirm) { renderControls(); return; }
  }

  setBusy(true, `Writing ${control.label}...`);
  try {
    let result = await api().set_control(control.code_key, bounded, confirm);
    if (result.needsConfirm) {
      const ok = await askConfirm(result.message);
      if (!ok) { renderControls(); return; }
      result = await api().set_control(control.code_key, bounded, true);
    }
    if (!result.ok) {
      toast(result.message, true);
      renderControls();
      return;
    }
    control.value = result.value;
    control.formatted = result.formatted;
    control._preview = null;
    toast(result.message);
    renderControls();
  } catch (error) {
    toast(String(error), true);
    renderControls();
  } finally {
    setBusy(false, state.monitor || 'Ready');
  }
}

function renderProfiles() {
  const box = document.getElementById('profiles-list');
  box.innerHTML = '';
  if (!state.profiles.length) {
    box.innerHTML = '<div style="color:var(--muted)">No saved profiles.</div>';
    return;
  }
  state.profiles.forEach((profile) => {
    const row = document.createElement('div');
    row.className = 'profile';
    row.innerHTML = `<span class="name"></span><span class="desc"></span><button class="primary">Apply</button>`;
    row.querySelector('.name').textContent = profile.name;
    row.querySelector('.desc').textContent = `${profile.count} codes · ${profile.description || 'no description'}`;
    row.querySelector('button').onclick = () => applyProfile(profile.name);
    box.appendChild(row);
  });
}

async function loadMonitor(index) {
  if (busy) return;
  setBusy(true, 'Reading monitor values...');
  try {
    const data = await api().select_monitor(index);
    state.active = index;
    state.monitor = data.monitor;
    state.controls = data.controls;
    renderMonitors();
    renderChips();
    renderControls();
    setBusy(false, data.monitor || 'Ready');
  } catch (error) {
    setBusy(false, 'Error');
    toast(String(error), true);
  }
}

async function applyProfile(name) {
  if (busy) return;
  setBusy(true, `Applying ${name}...`);
  try {
    const result = await api().apply_profile(name);
    if (!result.ok) { toast(result.message, true); return; }
    state.controls = result.controls;
    renderChips();
    renderControls();
    toast(result.message);
  } catch (error) {
    toast(String(error), true);
  } finally {
    setBusy(false, state.monitor || 'Ready');
  }
}

async function refreshAll() {
  if (busy) return;
  setBusy(true, 'Scanning monitors...');
  try {
    const data = await api().refresh();
    state.monitors = data.monitors;
    state.active = data.active;
    state.monitor = data.monitor;
    state.controls = data.controls;
    state.profiles = await api().profiles();
    renderMonitors();
    renderChips();
    renderControls();
    renderProfiles();
    setBusy(false, data.monitor || 'Ready');
  } catch (error) {
    setBusy(false, 'Error');
    toast(String(error), true);
  }
}

async function boot() {
  document.getElementById('refresh').onclick = refreshAll;
  await refreshAll();
}

if (window.pywebview) boot();
else window.addEventListener('pywebviewready', boot);
</script>
</body>
</html>
