name: Release

# Tag vX.Y.Z (matching Cargo.toml) -> tests, NSIS installer, GitHub pre-release.
# The installer is signed for the updater (secret TAURI_SIGNING_PRIVATE_KEY); latest.json goes to the fixed
# release tag `updates`, because GitHub's "latest" link skips pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the workspace version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $pkg = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME -or $pkg -ne $v) {
            throw "Tag $env:GITHUB_REF_NAME, Cargo.toml $v, package.json $pkg must all agree"
          }

      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cargo test -p sysvane-core -p sysvane-wire

      - name: Build installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci
          npx tauri build

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found' }
          $notesFile = "docs/releases/$env:GITHUB_REF_NAME.md"
          $notesArgs = if (Test-Path $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          gh release create $env:GITHUB_REF_NAME $setup.FullName --prerelease @notesArgs --title $env:GITHUB_REF_NAME
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($setup.Name)"
          $notes = gh release view $env:GITHUB_REF_NAME --json body --jq .body
          $json = @{ version = $v; notes = $notes; pub_date = (Get-Date).ToUniversalTime().ToString('o'); platforms = @{ 'windows-x86_64' = @{ signature = $sig.Trim(); url = $url } } } | ConvertTo-Json -Depth 5
          Set-Content latest.json $json -Encoding utf8
          gh release view updates *> $null
          if ($LASTEXITCODE -ne 0) { gh release create updates --title updates --notes 'Updater manifest, replaced on every release.' }
          gh release upload updates latest.json --clobber
