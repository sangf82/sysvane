[package]
name = "sysvane-core"
version.workspace = true
description = "SysVane headless background core"
edition.workspace = true

[dependencies]
libloading = "0.9.0"
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network", "component", "user"] }
sysvane-wire = { path = "../wire" }
toml = "1.2.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Power", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_UI_ColorSystem", "Win32_System_Registry"] }
